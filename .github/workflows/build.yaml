name: Build NixOS ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main

      - name: Build NixOS ISO
        run: |
          set -x
          # Build the ISO
          nix build .#nixosConfigurations.corednsMachine.config.formats.install-iso

          # Create a directory to store the ISO for artifact upload
          mkdir -p iso-output

          # Copy the ISO to the output directory with a more descriptive name
          cp -L result/*.iso iso-output/coredns-nixos.iso

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coredns-nixos-iso
          path: iso-output/coredns-nixos.iso
          # Optional: How long to retain the artifact (default is 90 days)
          retention-days: 7
          # Optional: Compression level (0-9)
          compression-level: 9
