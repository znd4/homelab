name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hosts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [hl01]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Build system closure
        run: nix build --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  installer-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Build installer ISO
        run: |
          nix build --print-build-logs .#installer-iso
          mkdir -p out && cp -L result/iso/*.iso out/homelab-installer.iso
      - uses: actions/upload-artifact@v4
        with:
          name: homelab-installer-iso
          path: out/homelab-installer.iso
          retention-days: 7
          compression-level: 0

  # VM test: DNS records, VIP failover, Caddy -> CUPS. Needs KVM, which
  # GitHub's Linux runners provide.
  dns-vm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix build --print-build-logs .#checks.x86_64-linux.dns-vm
